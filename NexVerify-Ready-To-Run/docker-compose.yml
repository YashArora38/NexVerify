version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NEXVERIFY_ENV=production
      - NEXVERIFY_DATA_DIR=/app/data
      - DATABASE_URL=sqlite:////app/data/nexverify.db
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NEXVERIFY_ANCHOR_RPC_URL=${SEPOLIA_RPC_URL:-}
      - NEXVERIFY_ANCHOR_CONTRACT=${NEXVERIFY_ANCHOR_CONTRACT:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
    volumes:
      - nexverify-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXVERIFY_INTERNAL_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXVERIFY_INTERNAL_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nexverify-data:
